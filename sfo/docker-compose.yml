
services:
  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: tileserver
    ports:
      - "8080:8080"
    volumes:
      - ../data:/data
      - ../style:/style
      - ../build:/build
    environment:
      - PORT=8080
    command: ["--port", "8080", "--config", "/style/config.json"]